[package]
name = "ld-core-derive"
description = "Derive macros for the `ld-core` Linked-Data serialization traits"
categories = ["encoding", "web-programming", "development-tools::procedural-macro-helpers"]
keywords = ["semantic-web", "linked-data", "rdf", "serialization", "derive"]
authors.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[package.metadata.docs.rs]
all-features = true

[lib]
proc-macro = true

[dependencies]
iri-rs = { version = "4.0.0", features = ["static"] }
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = "3.0.9"
thiserror = "2.0.21"
