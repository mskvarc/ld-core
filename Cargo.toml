[workspace.package]
authors = ["Spruce Systems, Inc."]
license = "MIT/Apache-2.0"
repository = "https://github.com/spruceid/linked-data-rs"
edition = "2021"
rust-version = "1.71.1"
version = "0.1.2"

[workspace]
members = ["ld-core", "ld-core-derive"]
