[package]
name = "ld-core"
description = "Linked-Data dateset serialization/deserialization traits"
categories = ["encoding", "web-programming"]
keywords = ["semantic-web", "linked-data", "rdf", "serialization"]
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = ["derive", "serde"]
derive = ["ld-core-derive"]

[dependencies]
educe = "0.6.0"
im = "15.1.0"
iri-rs = { version = "3.3.2", features = ["static"] }
jstrict = { git = "ssh://git@github.com/mskvarc/jstrict.git", features = ["canonicalize"] }
ld-core-derive = { workspace = true, optional = true }
rdf-rs = { git = "ssh://git@github.com/mskvarc/rdf-rs.git", version = "0.23.0" }
serde = { version = "1.0", features = ["derive"], optional = true }
xsd-rs = { git = "ssh://git@github.com/mskvarc/xsd-rs.git", version = "0.10.0" }
thiserror = "2.0.18"

[dev-dependencies]
jstrict = { git = "ssh://git@github.com/mskvarc/jstrict.git", features = ["serde"] }

[[example]]
name = "derive"
required-features = ["derive"]
