[package]
name = "ld-core"
description = "Linked-Data dataset serialization and deserialization traits, with derive macros"
categories = ["encoding", "web-programming", "data-structures"]
keywords = ["semantic-web", "linked-data", "rdf", "serialization", "derive"]
authors.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
default = ["derive", "serde"]
derive = ["dep:ld-core-derive"]
serde = ["dep:serde"]

[dependencies]
derive-where = "1.6.1"
derive_more = { version = "2.1.1", features = ["debug"] }
iri-rs = { version = "3.4.1", features = ["static"] }
jstrict = { version = "0.15.0", features = ["canonicalize"] }
ld-core-derive = { workspace = true, optional = true }
rdfx = "0.24.0"
rpds = "1.2.1"
serde = { version = "1.0.229", features = ["derive"], optional = true }
thiserror = "2.0.20"
xsd-rs = "0.10.0"

[dev-dependencies]
jstrict = { version = "0.15.0", features = ["serde"] }

[[example]]
name = "derive"
required-features = ["derive"]
